name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Run selftests
      run: |
        python selftest.py
        python db_selftest.py
        python gate_selftest.py
        python test_v6_bundle.py
        python test_v6_wiring.py
        python test_v6_steps67.py
        python test_v7_validators.py
        python test_display_layer.py
        python test_text_recovery.py
        python test_fat32_recovery.py
        python test_text_classify.py
        python test_text_ngram.py
        python test_text_search.py
        # Bounded-memory scan: streaming must cover everything the in-memory
        # pass covers, and a region must never be cut at a block edge.
        python test_text_search_stream.py
        # Golden fixtures (backlog item: reproducible reference data). The check
        # proves the committed bytes are exactly what scripts/generate_fixtures.py
        # produces from its fixed seed; the test then proves every negative
        # fixture stays silent and every positive one is found, at the coverage
        # and encoding recorded in fixtures/MANIFEST.json.
        python scripts/generate_fixtures.py --check
        python test_fixtures.py
        # Performance gate: fails if throughput drops below the published
        # target or if the scan stops scaling linearly (perf/README.md).
        python test_text_search_perf.py
        # Plant recall at a size where region merging is active: a reported
        # region must cover each planted text block, and the benchmark exits
        # non-zero otherwise.
        python perf/bench_text_search.py --sizes 5 --corpus mixed
        python perf/bench_text_search.py --sizes 5 --corpus noise
        python test_text_recovery_pipeline.py

    # Release safeguards (v7.0.2 rules). These run on every push/PR, so a tag
    # can never be created that disagrees with the VERSION in the code, and the
    # shipped archive can never come from a stale working tree.
    - name: Version gate - every VERSION literal must agree
      run: |
        python -c "import raw_scan, text_classify, text_ngram, text_recovery, fat32_recovery; vs=[raw_scan.VERSION, text_classify.VERSION, text_ngram.VERSION, text_recovery.VERSION, fat32_recovery.VERSION]; print('VERSION literals:', vs); assert len(set(vs))==1, 'VERSION literals disagree: %s' % vs; print('version gate OK:', vs[0])"

    - name: Version gate - tag must equal VERSION
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        python -c "import os, raw_scan; tag=os.environ['GITHUB_REF_NAME'].lstrip('v'); print('tag=%s code=%s' % (tag, raw_scan.VERSION)); assert tag==raw_scan.VERSION, 'tag %s != VERSION %s' % (tag, raw_scan.VERSION)"
