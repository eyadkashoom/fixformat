name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Run selftests
      run: |
        python selftest.py
        python db_selftest.py
        python gate_selftest.py
        python test_v6_bundle.py
        python test_v6_wiring.py
        python test_v6_steps67.py
        python test_v7_validators.py
        python test_display_layer.py
        python test_text_recovery.py
        python test_fat32_recovery.py
        python test_text_classify.py
        python test_text_recovery_pipeline.py
