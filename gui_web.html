<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>fixformat v7.0.1.2</title>
<style>
  :root {
    --bg: #0f1115; --panel: #161b22; --border: #30363d; --text: #e6edf3;
    --muted: #8b949e; --accent: #58a6ff; --danger: #f85149; --ok: #3fb950;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
               font-family: Segoe UI, Tahoma, Arial, sans-serif; }
  .wrap { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; padding: 12px; gap: 10px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { font-size: 16px; margin: 0; color: var(--accent); }
  .badge { font-size: 11px; color: var(--muted); border: 1px solid var(--border); padding: 2px 8px; border-radius: 999px; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; min-height: 0; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .panel h2 { font-size: 13px; margin: 0; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .row { display: flex; gap: 8px; align-items: center; }
  input[type=text] { flex: 1; background: #0d1117; color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; font-family: inherit; }
  button { background: #21262d; color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; cursor: pointer; font-family: inherit; }
  button:hover { border-color: #8b949e; }
  button.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  button.danger { background: #b62324; border-color: #b62324; color: #fff; }
  .progress { height: 10px; background: #0d1117; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
  .bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), #a371f7); transition: width .25s; }
  .log { flex: 1; background: #0d1117; border: 1px solid var(--border); border-radius: 8px; padding: 8px; font-family: Consolas, Monaco, monospace; font-size: 12px; color: #c9d1d9; overflow: auto; white-space: pre-wrap; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #21262d; }
  th { color: var(--muted); font-weight: 500; }
  .ok { color: var(--ok); } .err { color: var(--danger); } .muted { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>fixformat <span class="badge">v7.0.1.2</span></h1>
    <div class="badge" id="state">idle</div>
  </header>

  <main>
    <section class="panel">
      <h2>الهدف</h2>
      <div class="row">
        <input id="target" type="text" placeholder="مثال: \\\\.\\PhysicalDrive1  أو  F:\\image.img" value="" />
        <button id="btnStart" class="primary">ابدأ الفحص</button>
        <button id="btnStop" class="danger" disabled>إيقاف</button>
      </div>
      <div class="row">
        <div class="field" style="flex:1;"><label>patterns</label><input id="patterns" type="text" value="*.sig" /></div>
        <div class="field" style="flex:1;"><label>chunk_size</label><input id="chunk" type="number" value="1048576" /></div>
        <div class="field" style="flex:1;"><label>results_path</label><input id="results" type="text" value="./results.json" /></div>
      </div>
      <div class="row">
        <div class="field" style="flex:1;"><label>carve_before</label><input id="cbefore" type="number" value="4096" /></div>
        <div class="field" style="flex:1;"><label>carve_after</label><input id="cafter" type="number" value="65536" /></div>
        <div class="field" style="flex:1;"><label>carve_limit</label><input id="climit" type="number" value="100" /></div>
        <div class="field" style="flex:1;"><label>min_gap</label><input id="mingap" type="number" value="1048576" /></div>
      </div>
      <div class="row">
        <div class="field" style="flex:1;"><label>start_offset</label><input id="startoff" type="number" value="0" /></div>
        <div class="field" style="flex:1;"><label>end_offset</label><input id="endoff" type="text" value="" placeholder="auto" /></div>
        <div class="field" style="flex:1;"><label>deadline (s)</label><input id="deadline" type="number" value="0" /></div>
      </div>
      <div class="progress"><div id="bar" class="bar"></div></div>
      <div class="log" id="log">جاهز.</div>
    </section>

    <section class="panel">
      <h2>النتائج</h2>
      <div style="overflow:auto; flex:1;">
        <table>
          <thead><tr><th>#</th><th>الإزاحة</th><th>التوقيع</th><th>الحالة</th></tr></thead>
          <tbody id="hits"><tr><td colspan="4" class="muted">لا توجد نتائج بعد</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="muted" style="font-size:11px;">واجهة تجريبية — الإصدار v7.0.1.2 — stdlib only</footer>
</div>

<script>
const $ = id => document.getElementById(id);
let poll = null;

function log(msg) {
  const el = $('log');
  el.textContent += (el.textContent ? '\n' : '') + msg;
  el.scrollTop = el.scrollHeight;
}

function setState(s) {
  $('state').textContent = s;
  $('btnStart').disabled = (s === 'running');
  $('btnStop').disabled = (s !== 'running');
}

function start() {
  const target = $('target').value.trim();
  if (!target) { alert('أدخل هدف الفحص'); return; }
  const body = {
    target,
    patterns: $('patterns').value.trim() || '*.sig',
    chunk_size: parseInt($('chunk').value || '1048576', 10) || 1048576,
    results_path: $('results').value.trim() || './results.json',
    carve_before: parseInt($('cbefore').value || '4096', 10) || 4096,
    carve_after: parseInt($('cafter').value || '65536', 10) || 65536,
    carve_limit: parseInt($('climit').value || '100', 10) || 0,
    min_gap: parseInt($('mingap').value || '1048576', 10) || 0,
    start_offset: parseInt($('startoff').value || '0', 10) || 0,
    end_offset: ($('endoff').value.trim() === '' ? null : parseInt($('endoff').value, 10)),
    deadline: (parseInt($('deadline').value || '0', 10) || 0) ? (Date.now()/1000 + (parseInt($('deadline').value,10)||0)) : null,
  };
  $('hits').innerHTML = '';
  $('log').textContent = '';
  setState('running');
  fetch('/api/start', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  }).then(r => r.json()).then(d => {
    if (d.error) { log('خطأ: ' + d.error); setState('error'); return; }
    log('بدأ الفحص: ' + d.target);
    poll = setInterval(tick, 500);
  }).catch(e => { log('خطأ اتصال: ' + e); setState('idle'); });
}

function stop() {
  fetch('/api/stop', {method: 'POST'}).then(() => { log('تم إيقاف الفحص'); setState('idle'); clearInterval(poll); });
}

function tick() {
  fetch('/api/status').then(r => r.json()).then(s => {
    $('bar').style.width = (s.progress_pct || 0) + '%';
    if (s.status_line) log(s.status_line);
    if (s.error) { log('خطأ: ' + s.error); setState('error'); clearInterval(poll); return; }
    if (s.hits && s.hits.length) {
      const tb = $('hits');
      tb.innerHTML = s.hits.map((h, i) =>
        `<tr><td>${i+1}</td><td>0x${h.offset ?? '?'}</td><td>${h.sig ?? ''}</td><td class="ok">تم العثور</td></tr>`
      ).join('');
    }
    if (!s.running) { setState('done'); clearInterval(poll); log('انتهى الفحص.'); }
  });
}

$('btnStart').onclick = start;
$('btnStop').onclick = stop;
setState('idle');
</script>
</body>
</html>
